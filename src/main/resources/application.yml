spring:
  application:
    name: card-showcase

  datasource:
    url: jdbc:postgresql://localhost:5432/card_showcase
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  upload-dir: ./uploads
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    reply-to: order@68sportfield.com
  # Merchant identity for emails and the invoice. No defaults: blank means not provided,
  # and the corresponding block is omitted rather than invented.
  merchant:
    display-name: ${APP_MERCHANT_DISPLAY_NAME:}
    legal-name: ${APP_MERCHANT_LEGAL_NAME:}
    address: ${APP_MERCHANT_ADDRESS:}
  notification:
    admin-email: ${ADMIN_EMAIL:}
    enabled: true
  cart:
    cookie:
      secure: false   # set true in production (HTTPS only)
      same-site: Lax

server:
  port: 8080
  tomcat:
    max-http-response-size: 1048576