<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{admin/layout}"
      lang="en">
<head><title>Admin Users</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h4 fw-bold mb-1">Admin Users</h2>
            <p class="text-muted mb-0" style="font-size:.875rem;">Manage administrator accounts.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createAdminModal">
            <i class="bi bi-person-plus me-1"></i>New Admin
        </button>
    </div>

    <!-- Alert container for JS feedback -->
    <div id="alertContainer" class="mb-3"></div>

    <!-- Admin Users Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="admin : ${admins}" th:id="'row-' + ${admin.id}">
                            <td class="text-muted" style="font-size:.85rem;" th:text="${admin.id}">1</td>
                            <td>
                                <span class="fw-medium" th:text="${admin.username}">admin</span>
                            </td>
                            <td>
                                <span th:id="'role-badge-' + ${admin.id}"
                                      class="badge"
                                      th:classappend="${admin.role == 'SENIOR_ADMIN'} ? 'bg-primary' : 'bg-secondary'"
                                      th:text="${admin.role == 'SENIOR_ADMIN'} ? 'Senior Admin' : 'Admin'">
                                    Role
                                </span>
                            </td>
                            <td>
                                <span th:id="'status-badge-' + ${admin.id}"
                                      class="badge"
                                      th:classappend="${admin.isActive} ? 'bg-success' : 'bg-danger'"
                                      th:text="${admin.isActive} ? 'Active' : 'Disabled'">
                                    Status
                                </span>
                            </td>
                            <td class="text-end">
                                <!-- Role toggle -->
                                <button class="btn btn-sm btn-outline-secondary me-1"
                                        th:attr="onclick='toggleRole(' + ${admin.id} + ', \'' + ${admin.role} + '\')'"
                                        title="Toggle role">
                                    <i class="bi bi-arrow-repeat"></i>
                                    <span class="d-none d-md-inline ms-1">Role</span>
                                </button>
                                <!-- Enable/Disable toggle -->
                                <button class="btn btn-sm"
                                        th:classappend="${admin.isActive} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        th:attr="onclick='toggleEnabled(' + ${admin.id} + ', ' + ${admin.isActive} + ')'"
                                        th:title="${admin.isActive} ? 'Disable' : 'Enable'">
                                    <i class="bi" th:classappend="${admin.isActive} ? 'bi-person-x' : 'bi-person-check'"></i>
                                    <span class="d-none d-md-inline ms-1" th:text="${admin.isActive} ? 'Disable' : 'Enable'">Toggle</span>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(admins)}">
                            <td colspan="5" class="text-center text-muted py-4">No admin users found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Admin Modal -->
    <div class="modal fade" id="createAdminModal" tabindex="-1" aria-labelledby="createAdminModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createAdminModalLabel">
                        <i class="bi bi-person-plus me-2"></i>New Admin User
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="createError" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label for="newUsername" class="form-label fw-medium">Username</label>
                        <input type="text" id="newUsername" class="form-control" maxlength="50" autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-medium">Password</label>
                        <input type="password" id="newPassword" class="form-control" minlength="8" autocomplete="new-password">
                        <div class="form-text">Minimum 8 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label for="newRole" class="form-label fw-medium">Role</label>
                        <select id="newRole" class="form-select">
                            <option value="ADMIN">Admin</option>
                            <option value="SENIOR_ADMIN">Senior Admin</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createAdmin()">
                        <i class="bi bi-check-circle me-1"></i>Create
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
(function () {
    'use strict';

    // CSRF token (Spring Security injects it into the meta tags via SecurityConfig)
    function getCsrfToken() {
        var meta = document.querySelector('meta[name="_csrf"]');
        return meta ? meta.getAttribute('content') : '';
    }
    function getCsrfHeader() {
        var meta = document.querySelector('meta[name="_csrf_header"]');
        return meta ? meta.getAttribute('content') : 'X-CSRF-TOKEN';
    }

    function showAlert(message, type) {
        var container = document.getElementById('alertContainer');
        container.innerHTML = '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">'
            + message
            + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
    }

    function apiFetch(url, body) {
        var headers = { 'Content-Type': 'application/json' };
        headers[getCsrfHeader()] = getCsrfToken();
        return fetch(url, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(body)
        }).then(function (r) { return r.json(); });
    }

    window.createAdmin = function () {
        var username = document.getElementById('newUsername').value.trim();
        var password = document.getElementById('newPassword').value;
        var role     = document.getElementById('newRole').value;
        var errDiv   = document.getElementById('createError');

        errDiv.classList.add('d-none');
        errDiv.textContent = '';

        apiFetch('/admin/api/users', { username: username, password: password, role: role })
            .then(function (data) {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('createAdminModal')).hide();
                    showAlert('Admin user <strong>' + data.username + '</strong> created successfully.', 'success');
                    setTimeout(function () { window.location.reload(); }, 1200);
                } else {
                    errDiv.textContent = data.message || 'Failed to create admin user.';
                    errDiv.classList.remove('d-none');
                }
            })
            .catch(function () {
                errDiv.textContent = 'Network error. Please try again.';
                errDiv.classList.remove('d-none');
            });
    };

    window.toggleRole = function (adminId, currentRole) {
        var newRole = currentRole === 'SENIOR_ADMIN' ? 'ADMIN' : 'SENIOR_ADMIN';
        var label   = newRole === 'SENIOR_ADMIN' ? 'Senior Admin' : 'Admin';
        if (!confirm('Change role to ' + label + '?')) return;

        apiFetch('/admin/api/users/' + adminId + '/role', { role: newRole })
            .then(function (data) {
                if (data.success) {
                    var badge = document.getElementById('role-badge-' + adminId);
                    if (badge) {
                        badge.textContent = newRole === 'SENIOR_ADMIN' ? 'Senior Admin' : 'Admin';
                        badge.className = 'badge ' + (newRole === 'SENIOR_ADMIN' ? 'bg-primary' : 'bg-secondary');
                    }
                    showAlert('Role updated to <strong>' + label + '</strong>.', 'success');
                    // Reload to refresh button states
                    setTimeout(function () { window.location.reload(); }, 1000);
                } else {
                    showAlert(data.message || 'Failed to change role.', 'danger');
                }
            })
            .catch(function () { showAlert('Network error. Please try again.', 'danger'); });
    };

    window.toggleEnabled = function (adminId, currentlyActive) {
        var enable  = !currentlyActive;
        var action  = enable ? 'enable' : 'disable';
        if (!confirm('Are you sure you want to ' + action + ' this admin account?')) return;

        apiFetch('/admin/api/users/' + adminId + '/enabled', { enabled: enable })
            .then(function (data) {
                if (data.success) {
                    showAlert('Account ' + (enable ? 'enabled' : 'disabled') + ' successfully.', 'success');
                    setTimeout(function () { window.location.reload(); }, 1000);
                } else {
                    showAlert(data.message || 'Failed to update account status.', 'danger');
                }
            })
            .catch(function () { showAlert('Network error. Please try again.', 'danger'); });
    };
})();
</script>
</th:block>
</body>
</html>
