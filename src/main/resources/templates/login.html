<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="en">
<head>
  <title>Sign In — 68 Sport Field</title>
</head>
<body>
<div layout:fragment="content">

  <section class="cs-section-dark" style="min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;padding:60px 16px;">
    <div style="width:100%;max-width:420px;">

      <!-- Header -->
      <div style="text-align:center;margin-bottom:32px;">
        <h1 style="font-size:28px;font-weight:700;color:#ffffff;letter-spacing:-.5px;margin:0 0 8px;">Sign In</h1>
        <p style="color:rgba(255,255,255,0.5);font-size:15px;margin:0;">Welcome back to 68 Sport Field</p>
      </div>

      <!-- Flash / error messages -->
      <div th:if="${successMessage}"
           style="background:rgba(52,199,89,0.12);border:1px solid rgba(52,199,89,0.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:#34c759;font-size:14px;"
           th:text="${successMessage}"></div>
      <div th:if="${errorMessage}"
           style="background:rgba(255,59,48,0.12);border:1px solid rgba(255,59,48,0.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:#ff3b30;font-size:14px;"
           th:text="${errorMessage}"></div>
      <div th:if="${param.error}"
           style="background:rgba(255,59,48,0.12);border:1px solid rgba(255,59,48,0.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:#ff3b30;font-size:14px;">
        Invalid email or password.
      </div>

      <!-- Login form -->
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px;">
        <form th:action="@{/login}" method="post" novalidate>

          <div style="margin-bottom:18px;">
            <label style="display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);margin-bottom:8px;">Email</label>
            <input type="email" name="username"
                   style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-size:15px;color:#ffffff;outline:none;"
                   placeholder="you@example.com"
                   autocomplete="email"
                   required>
          </div>

          <div style="margin-bottom:24px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <label style="font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);">Password</label>
              <a th:href="@{/forgot-password}"
                 style="font-size:13px;color:#0071e3;text-decoration:none;">Forgot Password?</a>
            </div>
            <input type="password" name="password"
                   style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-size:15px;color:#ffffff;outline:none;"
                   placeholder="••••••••"
                   autocomplete="current-password"
                   required>
          </div>

          <button type="submit"
                  style="width:100%;background:#0071e3;color:#ffffff;border:none;border-radius:22px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;">
            Sign In
          </button>

        </form>
      </div>

      <p style="text-align:center;margin-top:24px;font-size:14px;color:rgba(255,255,255,0.5);">
        Don't have an account?
        <a th:href="@{/register}" style="color:#0071e3;text-decoration:none;font-weight:500;">Create Account</a>
      </p>

    </div>
  </section>

</div>
</body>
</html>
