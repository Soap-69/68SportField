<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="en">
<head>
  <title>Reset Password — 68 Sport Field</title>
</head>
<body>
<div layout:fragment="content">

  <section class="cs-section-dark" style="min-height:calc(100vh - 200px);display:flex;align-items:center;justify-content:center;padding:60px 16px;">
    <div style="width:100%;max-width:420px;">

      <div style="text-align:center;margin-bottom:32px;">
        <h1 style="font-size:28px;font-weight:700;color:#ffffff;letter-spacing:-.5px;margin:0 0 8px;">Reset Password</h1>
        <p style="color:rgba(255,255,255,0.5);font-size:15px;margin:0;">Enter your new password below.</p>
      </div>

      <div th:if="${errorMessage}"
           style="background:rgba(255,59,48,0.12);border:1px solid rgba(255,59,48,0.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:#ff3b30;font-size:14px;"
           th:text="${errorMessage}"></div>

      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px;">
        <form th:action="@{/reset-password}" method="post">

          <input type="hidden" name="token" th:value="${token}">

          <div style="margin-bottom:18px;">
            <label style="display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);margin-bottom:8px;">New Password</label>
            <input type="password" name="newPassword"
                   style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-size:15px;color:#ffffff;outline:none;"
                   placeholder="Minimum 8 characters"
                   autocomplete="new-password"
                   required>
            <span style="font-size:12px;color:rgba(255,255,255,0.35);margin-top:4px;display:block;">
              Must include uppercase, lowercase, and a number.
            </span>
          </div>

          <div style="margin-bottom:28px;">
            <label style="display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);margin-bottom:8px;">Confirm New Password</label>
            <input type="password" name="confirmPassword"
                   style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-size:15px;color:#ffffff;outline:none;"
                   placeholder="••••••••"
                   autocomplete="new-password"
                   required>
          </div>

          <button type="submit"
                  style="width:100%;background:#0071e3;color:#ffffff;border:none;border-radius:22px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;">
            Reset Password
          </button>

        </form>
      </div>

    </div>
  </section>

</div>
</body>
</html>
