<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}"
      lang="en">
<head>
  <title>Change Password — 68 Sport Field</title>
</head>
<body>
<div layout:fragment="content">

  <section class="cs-section-dark" style="padding:48px 0 64px;">
    <div class="cs-container">

      <h1 style="font-size:24px;font-weight:700;color:#ffffff;margin:0 0 32px;">My Account</h1>

      <div style="display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start;">

        <!-- Sidebar -->
        <div th:replace="~{fragments/account-nav :: accountNav('change-password')}"></div>

        <!-- Content -->
        <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:28px;">

          <h2 style="font-size:18px;font-weight:600;color:#ffffff;margin:0 0 24px;">Change Password</h2>

          <div th:if="${successMessage}"
               style="background:rgba(52,199,89,0.12);border:1px solid rgba(52,199,89,0.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:#34c759;font-size:14px;"
               th:text="${successMessage}"></div>
          <div th:if="${errorMessage}"
               style="background:rgba(255,59,48,0.12);border:1px solid rgba(255,59,48,0.3);border-radius:10px;padding:12px 16px;margin-bottom:20px;color:#ff3b30;font-size:14px;"
               th:text="${errorMessage}"></div>

          <form th:action="@{/account/change-password}" method="post" novalidate style="max-width:400px;">

            <div style="margin-bottom:18px;">
              <label style="display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);margin-bottom:8px;">Current Password</label>
              <input type="password" name="currentPassword"
                     style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px 14px;font-size:14px;color:#ffffff;outline:none;"
                     autocomplete="current-password"
                     required>
            </div>

            <div style="margin-bottom:18px;">
              <label style="display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);margin-bottom:8px;">New Password</label>
              <input type="password" name="newPassword"
                     style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px 14px;font-size:14px;color:#ffffff;outline:none;"
                     autocomplete="new-password"
                     placeholder="Minimum 8 characters"
                     required>
              <span style="font-size:12px;color:rgba(255,255,255,0.35);margin-top:4px;display:block;">
                Must include uppercase, lowercase, and a number.
              </span>
            </div>

            <div style="margin-bottom:28px;">
              <label style="display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);margin-bottom:8px;">Confirm New Password</label>
              <input type="password" name="confirmNewPassword"
                     style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:11px 14px;font-size:14px;color:#ffffff;outline:none;"
                     autocomplete="new-password"
                     required>
            </div>

            <button type="submit"
                    style="background:#0071e3;color:#ffffff;border:none;border-radius:22px;padding:11px 28px;font-size:14px;font-weight:600;cursor:pointer;">
              Update Password
            </button>

          </form>
        </div>
      </div>

    </div>
  </section>

</div>
</body>
</html>
