<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!--
  Account sidebar navigation fragment.
  Usage: <div th:replace="~{fragments/account-nav :: accountNav(activeTab='profile')}"></div>
  activeTab values: profile, addresses, orders, change-password
-->
<nav th:fragment="accountNav(activeTab)"
     style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:8px;">
  <a th:href="@{/account/profile}"
     th:style="${activeTab == 'profile'} ? 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:#ffffff;background:rgba(0,113,227,0.18);' : 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:400;color:rgba(255,255,255,0.65);'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    Profile
  </a>
  <a th:href="@{/account/addresses}"
     th:style="${activeTab == 'addresses'} ? 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:#ffffff;background:rgba(0,113,227,0.18);' : 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:400;color:rgba(255,255,255,0.65);'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    Addresses
  </a>
  <a th:href="@{/account/orders}"
     th:style="${activeTab == 'orders'} ? 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:#ffffff;background:rgba(0,113,227,0.18);' : 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:400;color:rgba(255,255,255,0.65);'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/>
    </svg>
    Orders
  </a>
  <a th:href="@{/account/change-password}"
     th:style="${activeTab == 'change-password'} ? 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:#ffffff;background:rgba(0,113,227,0.18);' : 'display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:400;color:rgba(255,255,255,0.65);'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Change Password
  </a>
  <div style="height:1px;background:rgba(255,255,255,0.06);margin:6px 8px;"></div>
  <form th:action="@{/logout}" method="post" style="margin:0;">
    <button type="submit"
            style="display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;background:none;border:none;font-size:14px;font-weight:400;color:rgba(255,255,255,0.5);cursor:pointer;text-align:left;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign Out
    </button>
  </form>
</nav>

</body>
</html>
