<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>New paid order</title></head>
<body style="margin:0;padding:0;background:#f5f5f7;font-family:Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;">
  <tr><td align="center" style="padding:32px 16px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;">
      <tr><td style="padding:28px 32px;font-size:15px;color:#1d1d1f;">
        <p style="margin:0 0 12px;font-size:18px;font-weight:700;">New paid order</p>
        <p style="margin:0 0 4px;"><strong>Order number:</strong> <span th:text="${order.orderNumber}">ORD</span></p>
        <p style="margin:0 0 4px;"><strong>Total:</strong> <span th:text="'$' + ${#numbers.formatDecimal(order.total, 1, 2)}">$0.00</span></p>
        <p style="margin:0 0 4px;"><strong>Customer:</strong>
          <span th:text="${order.customer != null} ? (${order.customer.firstName} + ' ' + ${order.customer.lastName}) : (${order.guestName} + ' (guest)')">Name</span></p>
        <p style="margin:0 0 4px;"><strong>Ship to:</strong>
          <span th:text="${order.shippingCity} + ', ' + ${order.shippingState}">City</span></p>
        <p style="margin:0 0 16px;"><strong>Shipping:</strong> <span th:text="${shippingLine}">$0.00</span></p>
        <p style="margin:0;"><a th:href="${adminLink}" style="color:#0071e3;">Open order in admin</a></p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
