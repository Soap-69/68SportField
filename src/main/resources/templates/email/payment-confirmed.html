<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Payment confirmed</title></head>
<body style="margin:0;padding:0;background:#f5f5f7;">
<div th:replace="~{email/fragments :: header}"></div>
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;">
  <tr><td align="center" style="padding:0 16px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;">
      <tr><td style="padding:0 32px 16px;font-family:Helvetica,Arial,sans-serif;font-size:15px;color:#1d1d1f;">
        <p style="margin:0 0 8px;font-weight:600;">Payment received.</p>
        <p style="margin:0 0 8px;">We received your payment of
          <strong th:text="'$' + ${#numbers.formatDecimal(paymentAmount, 1, 2)}">$0.00</strong>
          for the order below. Your invoice is attached as a PDF.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
<div th:replace="~{email/fragments :: orderSummary}"></div>
<div th:replace="~{email/fragments :: footer}"></div>
</body>
</html>
