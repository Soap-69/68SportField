<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title th:text="${shippingPaymentPending} ? 'Shipping payment requested' : 'Shipping update'">Shipping update</title></head>
<body style="margin:0;padding:0;background:#f5f5f7;">
<div th:replace="~{email/fragments :: header}"></div>
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;">
  <tr><td align="center" style="padding:0 16px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;">
      <tr><td style="padding:0 32px 16px;font-family:Helvetica,Arial,sans-serif;font-size:15px;color:#1d1d1f;">
        <p style="margin:0 0 8px;font-weight:600;" th:text="${shippingPaymentPending} ? 'Shipping payment requested.' : 'Shipping update.'">Shipping update.</p>
        <p style="margin:0 0 8px;">The shipping cost for order
          <strong th:text="${order.orderNumber}">ORD</strong> is
          <strong th:text="'$' + ${#numbers.formatDecimal(shipment.quotedShippingAmount, 1, 2)}">$0.00</strong>.</p>
        <p th:if="${shippingPaymentPending}" style="margin:0;">Please reply to
          <a th:href="'mailto:' + ${replyTo}" th:text="${replyTo}" style="color:#0071e3;">reply</a>
          to confirm your payment method for this amount.</p>
        <p th:unless="${shippingPaymentPending}" style="margin:0;" th:text="${shippingLine}">Shipping status</p>
      </td></tr>
    </table>
  </td></tr>
</table>
<div th:replace="~{email/fragments :: orderSummary}"></div>
<div th:replace="~{email/fragments :: footer}"></div>
</body>
</html>
