spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  servlet:
    session:
      cookie:
        # The site is HTTPS-only at the edge; the app itself sits behind a plain-HTTP proxy
        # and does not read forwarded headers, so the flag must be explicit (Week 9 O2).
        secure: true
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

app:
  upload-dir: /app/uploads
  base-url: https://68sportfield.com
  cart:
    cookie:
      secure: true
  notification:
    admin-email: ${ADMIN_EMAIL:}
    # Stays false until the production JVM timezone and historical write zone are
    # confirmed (Week 8 D7 gate) and SMTP credentials are verified. Note that this
    # flag gates emails only; the invoice download endpoints print dates regardless.
    enabled: ${APP_NOTIFICATION_ENABLED:false}

logging:
  level:
    root: WARN
    com.cardshowcase: INFO
